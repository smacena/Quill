name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test portable core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure

  macos:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (universal arm64 + x86_64)
        run: |
          set -o pipefail
          cmake --build build -j "$(sysctl -n hw.ncpu)" 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: grep -E "error:|Error |undefined|ld:" build.log | head -150 || true

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign (ad-hoc) and package
        run: |
          APP=build/app/Quill.app
          lipo -info "$APP/Contents/MacOS/Quill"
          ls -la "$APP/Contents/PlugIns" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" Quill-macOS.zip

      - name: Start test SFTP and FTP servers (for the FTP plugin test)
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/quill_test -q
          cat ~/.ssh/quill_test.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || sudo systemsetup -setremotelogin on || true
          for i in $(seq 1 15); do nc -z 127.0.0.1 22 && break; sleep 1; done
          mkdir -p ~/quill-sftp-test
          if ssh -i ~/.ssh/quill_test -o StrictHostKeyChecking=accept-new -o BatchMode=yes 127.0.0.1 true; then
            echo "QUILL_TEST_SFTP_USER=$(whoami)" >> "$GITHUB_ENV"
            echo "QUILL_TEST_SFTP_KEY=$HOME/.ssh/quill_test" >> "$GITHUB_ENV"
            echo "QUILL_TEST_SFTP_DIR=$HOME/quill-sftp-test" >> "$GITHUB_ENV"
            echo "SFTP server ready"
          fi
          python3 -m venv /tmp/ftpenv
          /tmp/ftpenv/bin/pip install -q pyftpdlib
          mkdir -p /tmp/ftproot
          nohup /tmp/ftpenv/bin/python -m pyftpdlib -i 127.0.0.1 -p 2121 -w -d /tmp/ftproot -u quill -P secret > /tmp/ftpd.log 2>&1 &
          for i in $(seq 1 15); do nc -z 127.0.0.1 2121 && break; sleep 1; done
          if nc -z 127.0.0.1 2121; then echo "QUILL_TEST_FTP_PORT=2121" >> "$GITHUB_ENV"; echo "FTP server ready"; fi

      - name: Self test (opens the app and exercises every feature)
        id: selftest
        run: |
          mkdir -p selftest
          set +e
          perl -e 'alarm 300; exec @ARGV' build/app/Quill.app/Contents/MacOS/Quill -UILanguage en --selftest "$PWD/selftest" > selftest/stdout.txt 2>&1
          code=$?
          set -e
          cat selftest/stdout.txt | tail -80
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          # Portuguese interface screenshot
          perl -e 'alarm 120; exec @ARGV' build/app/Quill.app/Contents/MacOS/Quill -UILanguage pt --selftest "$PWD/selftest" --quick > selftest/stdout-pt.txt 2>&1 || true
          exit $code

      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quill-macOS
          path: Quill-macOS.zip
          if-no-files-found: ignore

      - name: Upload self test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: |
            selftest
            build.log
          if-no-files-found: ignore

      - name: Publish "latest" release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Quill-macOS.zip \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Quill — latest build" \
            --notes "Automatic build of ${{ github.sha }}. Download Quill-macOS.zip, unzip, move Quill.app to Applications. First launch: right-click → Open (the app is ad-hoc signed)."
